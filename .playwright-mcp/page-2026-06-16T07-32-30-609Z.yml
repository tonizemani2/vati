  - generic [ref=e68]:
    - generic [ref=e69]:
      - heading "P1 · The ceiling on the AI-compute wafer build-out is not ASML, EUV source power, or fab shells. It is Zeiss SMT ion-beam-figuring throughput for EUV/High-NA projection mirror sets at one site in Oberkochen, Germany." [level=2] [ref=e70]
      - generic [ref=e71]: P1
    - paragraph [ref=e72]: "The boom: The loud story says ASML is the monopoly and EUV source power is the throughput knob. Capital is flooding into fab shells (TSMC AZ, Intel, Samsung, Rapidus) on the assumption the scanners will follow. Sell-side equity models and export-control rules both treat the ASML scanner as the atomic unit of scarcity. Neither breaks out the projection optics module as a separate, slower-moving constraint. · Domain: semiconductors"
    - generic [ref=e73]:
      - generic [ref=e74]:
        - generic [ref=e75]: Structural case
        - generic [ref=e76]: 82%
      - generic [ref=e77]:
        - generic [ref=e78]: Our call, dated
        - generic [ref=e79]: 52%
      - generic [ref=e80]:
        - generic [ref=e81]: Resolves
        - generic [ref=e82]: 2032-12-31
    - paragraph [ref=e83]: "An EUV scanner's resolution lives entirely in its Zeiss SMT projection optics: six aspheric Mo/Si multilayer mirrors polished and ion-beam-figured to roughly 50-picometer surface deviation, then coated with 50-plus individually sputtered Mo/Si layer pairs. Each mirror needs iterative measurement-correction cycles run on custom interferometers that themselves take years to build and qualify. A full set is effectively a one-year artisanal build. The work sits at Zeiss SMT Oberkochen, where three decades of tacit skill in deterministic ion-beam figuring and closed-loop metrology have piled up. High-NA (0.55 NA) makes it worse: anamorphic mirrors of larger aperture, tighter tolerances, lower yield per attempt. No second qualified projection-optics figuring site exists. Zeiss has expanded globally for mask inspection (AIMS EUV 3.0), but mask inspection is not projection optics figuring, and the two share no relevant tacit-skill base. The supply elasticity of this input is near zero on any horizon shorter than a decade. As every hyperscaler and nation-state races to add leading-edge capacity at once, they are all bidding for the output of one optics shop's polishing benches, and that output grows in the low single digits per year at best. Fab shells, HBM, and packaging can be funded in parallel. Projection mirror sets cannot. Web search confirms High-NA volume ramp stays in the low tens of systems per year through at least 2028, with no second figuring site announced as of June 2026."
    - generic [ref=e84]:
      - generic [ref=e85]: Why it is not priced yet
      - text: The market prices ASML the company as the monopoly and EUV source power as the throughput knob. Sell-side equity models do not break out Zeiss optics-figuring throughput as a separate capacity ceiling. Export-control rules (US BIS, Dutch Dekra controls) target the ASML scanner and DUV steppers; nothing targets optics modules on their own. Specialist semi media (SemiconductorX, The Elec) mention the Zeiss dependency in passing but frame it as handled for standard EUV, without modeling it as the governor on the High-NA ramp. FUTURE_MAP covers EUV source-side constraints (InP CW lasers, dry resist) but not projection-optics fabrication throughput. The specific move of the binding constraint from scanner to optics figuring at a single tacit-skill site is missing from equity modeling and policy framing.
    - generic [ref=e86]:
      - generic [ref=e87]: Where the price sits today
      - text: No financial instrument prices Zeiss optics-figuring throughput directly. ASML trades on order backlog and system shipments; the optics module is not broken out in any sell-side model. No second-source or capacity-expansion announcement has opened a price channel as of June 2026.
    - generic [ref=e88]:
      - generic [ref=e89]: The binding constraint
      - text: Zeiss SMT deterministic ion-beam-figuring and Mo/Si multilayer-coating throughput for EUV/High-NA projection mirror sets at sub-100pm figure accuracy, single site Oberkochen, tacit-skill-bound, roughly one year per mirror set.
    - generic [ref=e90]:
      - generic [ref=e91]: What we are watching
      - text: "Zeiss SMT / ASML disclosed or inferable annual EUV plus High-NA projection-optics module output (proxy: ASML EUV plus High-NA system shipments capped by optics, vs. ASML's stated build-capacity ambition). Track the gap between ASML order backlog and delivered EUV units attributable to optics lead time, and any Zeiss SMT capacity-expansion or second-figuring-site announcement. Current baseline: High-NA production rate in low tens per year through 2028 per industry projections; no second figuring site exists as of June 2026."
    - generic [ref=e92]:
      - generic [ref=e93]: What would prove us wrong
      - text: Kill if by 2032 Zeiss/ASML demonstrably break the one-set-per-year figuring rate at scale (for example a qualified second figuring or coating site outside Oberkochen, or robotic/computational-polishing pushing High-NA optics-module output above roughly 30 sets per year), OR if leading-edge wafer demand is met without optics being the binding scanner sub-component (source, stage, or throughput dominates the delivery gap instead), OR if a non-Zeiss EUV optics supplier qualifies for production scanners.
    - generic [ref=e94]:
      - generic [ref=e95]: How we tried to break it
      - text: Three honest attacks. First, ASML management said in 2024 that the optics supply challenges from Zeiss had been resolved. That referred to standard EUV, and High-NA resets the difficulty at strictly tighter tolerances, so it is not a kill. Second, High-NA is early-ramp and not yet where most AI-accelerator wafers are made. The constraint bites hardest at sub-2nm nodes; standard EUV (0.33 NA) keeps serving 3nm/2nm where today's AI training silicon lives. That is a real scope limit and it keeps our second number off the high end even though the mechanism is credible. Third, 6.5 years is long enough for a partial supply response given the financial incentive. Zeiss is trying (roughly 2,000 of 9,349 employees working on High-NA as of 2025), and robotic and computational polishing are active research areas. The open question is whether any of that turns into a qualified second figuring site or a step-change in throughput by 2032. The physical difficulty and the tacit-knowledge moat make it unlikely on that timeline, not impossible. The structural claim survives because no current evidence contradicts the core physical inelasticity and no second site is on the horizon.
    - generic [ref=e96]: "Why we are making the call We think the physical mechanism is real and tightly specified, and the supply inelasticity at Oberkochen is genuine and not replicated anywhere else. The market frames this wrong at the level that matters: equity and policy both treat the scanner as atomic when the real constraint is one optics shop's polishing benches. The input is named precisely, the kill criteria are honest, and the call holds up under attack. Two things keep our second number at 0.52 rather than higher: High-NA is not yet the dominant AI-wafer node, and 6.5 years leaves room for a partial supply response. The structural read sits at 0.82. We'd promote it with the scope caveat marked."
