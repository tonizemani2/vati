        - generic [ref=e106]:
          - heading "Who loses" [level=5] [ref=e107]
          - generic [ref=e108]: "Greenfield fab projects (Rapidus, second-wave Intel): capital cannot buy an optics set that does not exist; shells sit idle"
          - generic [ref=e109]: "Sell-side models pricing ASML on shipment count: they miss the optics-module governor and misdate the ramp"
      - generic [ref=e110]: What reprices
      - paragraph [ref=e111]: ASML delivery guidance for High-NA slips relative to backlog; the gap shows up as lengthening lead times, not a headline cut. Watch the spread between ASML order backlog and optics-attributable deliveries.
      - generic [ref=e112]: The next constraint it creates
