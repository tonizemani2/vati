    - paragraph [ref=e404]:
      - emphasis [ref=e405]: The binding constraint is rarely the named monopoly. It is the artisanal sub-step, the byproduct metal, the second-decade engineer, and the isotope cascade that money cannot ramp on a fab timeline.
    - paragraph [ref=e406]: "These six calls share one structural shape: capital, tools, and wafer capacity are all financializable on a capex clock, but the actual ceiling sits one or two layers below the priced narrative at an input whose supply grows on a physical or biological clock, not a financial one. Three of the six are tacit-knowledge or labor constraints (Zeiss Oberkochen optics figuring, senior yield/integration engineers, certified UHP hookup welders) where the supply curve is set by how fast a human accumulates a decade of on-line experience or a trade certifies a fitter, neither of which parallelizes with money. Two are single-vendor or single-site equipment chokepoints (Zeiss again, IMS multibeam mask writers) where lead times of 18 to 36 months and a nonexistent second qualified source cap how fast output can rise. Two are geologically or isotopically inelastic materials (ruthenium as a 30 t/yr platinum byproduct with no primary mine, enriched Si-28 from export-controlled separation cascades). The common edge is not that these inputs are unknown, but that the equity and policy channels price the wrong unit: they price ASML the company, not Zeiss the polishing bench; the fab as capex, not the yield-curve carrier; the metal price, not the chip-ramp gating risk. The strongest calls cleanly separate vision_p (is the physical mechanism real and inelastic) from clause_p (does the specific dated, disclosure-dependent clause fire), and the lower clause scores honestly reflect substitution routes (molybdenum for ruthenium, Cu-Cu hybrid bonding for solder, superconducting qubits for silicon spin) and the fact that several resolution triggers depend on a public disclosure that supply chains may manage quietly."
