  - generic [ref=e296]:
    - generic [ref=e297]: space and the space economy (launch vehicles and propulsion,
    - 'heading "Where the Space Economy''s Rent Migrates: Six Physical Walls Cheap Launch Cannot Move" [level=2] [ref=e298]'
    - paragraph [ref=e299]:
      - emphasis [ref=e300]: When you make getting to orbit free, scarcity jumps to the inputs that obey thermodynamics, decay physics, and treaty-fixed spectrum, not learning curves.
    - paragraph [ref=e301]: "Every one of these six calls follows the same migration logic and the consensus misses it the same way. The funded, visible bottleneck in space is always transport: launch cost, cadence, landers, GPUs. Cheap reusable launch is collapsing that layer, and the market is pricing the collapse as if it solves the whole stack. It does not. It relocates the binding constraint to a small set of inputs that do not ride any learning curve because they are pinned by a physical or institutional invariant: radiative heat rejection in vacuum is fixed by Stefan-Boltzmann T-to-the-fourth (P1); the 354-hour lunar night sets a linear energy-storage mass floor that only fission escapes (P2); deep-space link budgets need treaty-protected S/X/Ka bands and 70 m steel that takes a decade to pour (P3); LEO position uncertainty is dominated by thermospheric density that a near-dead, non-commercial sensor base cannot forecast (P4); every US radioisotope heat source is clad in a single arc-remelted iridium alloy from one reconstituted ORNL line now bidding against the hydrogen buildout for the same 7-tonne-per-year metal stream (P5); and the stratosphere is a finite, 30-year-clearance alumina sink that a self-replacing megaconstellation fills monotonically (P6). In each case the needle is a specific inelastic input (square-meters of deployable radiator per kilowatt, kilograms of night-survival storage per watt, large-aperture antenna-hours, in-situ density-driver data, qualified iridium clad-vent-set throughput, qualified non-aluminum demisable structure) and in each case capital is still pricing the layer above it. The themes are now audible (cooling is hard, Pu-238 is short, reentry chemistry exists in geoscience papers); the quantitative, rent-bearing needles are not in a single equity model, sell-side note, or futures contract. That gap between an audible theme and an unpriced needle is the entire edge."
    - link "Download the full board PDF, with sources and refute notes ↓" [ref=e302] [cursor=pointer]:
      - /url: space.pdf
