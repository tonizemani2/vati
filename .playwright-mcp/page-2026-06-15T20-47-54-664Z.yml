      - article [ref=e199]:
        - generic [ref=e200]:
          - generic [ref=e201]: P1
          - generic [ref=e202]: resolves 2032-12-31
        - 'heading "Hafnium is a byproduct-pinned trickle now hostage to three inelastic buyers at once: nuclear control rods, advanced-node HfO2 gate dielectric, and single-crystal turbine-blade superalloys. China cut exports 90 percent in H2 2025 and the price tripled from $4,365 to ~$13,115/kg by April 2026, but the long-horizon structural lock is the byproduct ratio itself, not the export headline." [level=3] [ref=e203]'
        - generic [ref=e204]:
          - generic [ref=e205]: vision 82%
          - generic [ref=e206]: clause 70%
        - generic [ref=e207]:
          - generic [ref=e208]: Binding constraint (the needle)
          - text: "Nuclear- and electronic-grade high-purity hafnium: the poison fraction stripped off nuclear-grade zirconium sponge, specifically the contention between control-rod-grade Hf, the semiconductor HfO2/HfZrO precursor, and superalloy-additive Hf for the same few-hundred-tonne annual byproduct stream. Not \"critical minerals,\" not \"hafnium\" broadly, but the byproduct-pinned high-purity sub-node that three sectors share."
        - generic [ref=e209]:
          - generic [ref=e210]: Leading metric
          - text: "High-purity hafnium price ($/kg) and lead time, the spread between nuclear/electronic grade and industrial grade, and the level of Chinese hafnium export licensing/volumes. Anchor (verified June 2026): Jan 2025 ~$4,365/kg, Jan 2026 ~$9,500/kg (+117 percent), ~$13,115/kg by April 2026; China unwrought hafnium exports down ~90 percent across 2025 (≈5,001 kg in Jan to ≈499 kg in Sep). Nuclear/electronic grade trades a large premium over industrial."
        - generic [ref=e211]:
          - generic [ref=e212]: Kill-criterion
          - text: Kill if, before 2033, high-purity hafnium real price falls back below ~$5,000/kg and holds for a sustained stretch (signaling new dehafniation or recycling capacity actually caught up, or Chinese licensing meaningfully relaxed), OR if a non-hafnium high-k dielectric stack is qualified at a leading logic node AND a hafnium-free single-crystal superalloy reaches turbine-blade qualification, removing two of the three demand legs. Note the current substitution research moves the wrong way for the bear case (Hf-Zr superlattices use more Hf). Persistent multi-year tightness with China-concentrated licensing leverage and price holding well above the 2025 baseline resolves it true.
