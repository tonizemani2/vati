  - generic [ref=e118]:
    - generic [ref=e119]: any area, wide open across all industries
    - 'heading "Where the Rent Moves Next: Four Binding Constraints Capital Has Not Yet Found" [level=2] [ref=e120]'
    - paragraph [ref=e121]:
      - emphasis [ref=e122]: The shortage everyone funds is at the factory. The rent has already left for the deck of the ship, the certified hands, and the isotope nobody in the West can legally make.
    - paragraph [ref=e123]: "The loudest shared shift across these calls is the same one, repeated in four different physical systems: capital and headlines pile into the fast, fundable, capital-intensive layer (cable plants, copper mines, fusion magnets, grid transformers), and once that layer is solved, the binding constraint does not vanish but relocates one node downstream onto something money cannot mint on the same clock. In three of the four cases that residual node is people or a permitted process, not steel. Certified offshore HV jointers, settings-grade protection-and-control relay engineers, journeyman linemen: a multi-year, retiring, non-compressible apprenticeship pipeline sits under every cable, substation, and interconnection. In copper the residual is qualified non-China smelting capacity, irreversible multi-billion-dollar assets being culled asymmetrically while the market still prices a mine-and-demand story. The Li-6 fusion call is the purest form of the pattern: the input is physically required, its only scaled production route is treaty-banned, and live capacity is held only by two adversary states. The common tell is the price channel. In each case the priced rival constraint is the hardware layer, and the genuinely inelastic node has no liquid market anyone is trading, which is exactly why it is the live edge. The honest tax, reflected in every clause_p sitting well below its vision_p, is that these are conjunctive, dated clauses and the downstream node always has one elasticity leak: offshored relay-settings work, robotic jointing, new state-backed Asian smelters, a natural-lithium blanket redesign."
    - link "Download the full board PDF, with sources and refute notes ↓" [ref=e124] [cursor=pointer]:
      - /url: structural.pdf
