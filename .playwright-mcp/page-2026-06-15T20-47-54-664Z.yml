  - generic [ref=e62]:
    - generic [ref=e63]: any area, wide open across all industries
    - 'heading "Catalyst Board: Three Commodity Reversals Where the Cure Is Already Funded" [level=2] [ref=e64]'
    - paragraph [ref=e65]: _The crowd is pricing the spike; the dated event that breaks it has already fired or is already built._
    - paragraph [ref=e66]: "The loudest shared shift on this board is that in three separate commodity chains, the supply response the bulls are betting against has already been triggered by a specific, dated event, and the market has not yet repriced the duration or magnitude. In polysilicon, SAMR's January 2026 prohibition legally removed the only tool that could have cut capacity, so the clearing path is now slow attrition with the price pinned below cash cost. In DRAM, the fabs that reverse the 2026 memflation spike are physically committed with mid-2027 completion dates (Micron Idaho, Samsung P4L), arriving onto a channel carrying double-ordered inventory that must unwind. In battery-grade nickel, two stacked acid shocks (the Hormuz closure plus China's May 1 sulfuric-acid export ban) are curtailing Indonesian MHP right now, so the chemical-grade chain is going into deficit while the headline LME metal stays in surplus. The common structural read: a headline price level driven by an allocation choice or a coordination expectation is mistaken for a regime change, when the physical and regulatory mechanism for reversal is already in place. Each call resolves inside 18 months with a hard, dated clause, so the board scores within the year. The shared risk is also explicit and timing-shaped: in every case the direction is well-supported but the by-the-date magnitude is the genuine coin flip, which is why two of three clause probabilities sit near 0.45 even with high vision conviction."
