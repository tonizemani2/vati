  - generic [ref=e191]:
    - generic [ref=e192]: "cross-domain: critical materials, energy, biotech, AI-for-sc"
    - 'heading "Where the constraint moves next: six inelastic needles the market has not priced" [level=2] [ref=e193]'
    - paragraph [ref=e194]:
      - emphasis [ref=e195]: Rent accrues to the binding input. These six calls name the specific molecule, isotope, donor body, or tacit craft that cannot scale on its price signal, and mark exactly where each claim ends.
    - paragraph [ref=e196]: "Every call here obeys one mechanism: a downstream system scales fast while one upstream input is fixed by physics, chemistry, demography, or treaty, so the rent migrates onto the input that cannot answer a price signal. Hafnium and sulfuric acid are byproduct-pinned trickles set by someone else's process (zirconium refining, fossil desulfurization), so you cannot make more without overmaking a product nobody wants; both now face multiple inelastic buyers converging at once. Lithium-6 is fixed at 7.5 percent of natural lithium and its only volume-proven separation route is treaty-banned, leaving a China/Russia duopoly two layers below the fusion plasma everyone watches. Blood and the EHV commissioning craft are demographic locks: the donor-eligible cohort and the 1980s-trained energization journeymen are already born and already shrinking while the consuming cohort grows, and you cannot manufacture a young vein or a four-to-seven-year tacit seasoning. Connectome proofreading inverts the usual AI story, because a better auto-segmentation model raises the value of the human gold reference it must be checked against rather than erasing it. The honest boundary across all six is the same: the structural mechanism is near-locked (vision_p high), but each dated clause carries a real timing-and-measurement tax (clause_p near or below a coin flip) because a demand-side release valve, a crash program, or a wording threshold can blunt the exact resolution without touching the physics. The edge is the input, not the headline; the discipline is keeping the clause odds honest."
    - link "Download the full board PDF, with sources and refute notes ↓" [ref=e197] [cursor=pointer]:
      - /url: inelastic-needles.pdf
