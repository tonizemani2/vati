    - generic [ref=e507]: biotech and human health (drug modalities and delivery, biom
    - 'heading "Where the constraint migrates in biotech: finite atoms and human donors that capital cannot replicate" [level=2] [ref=e508]'
    - paragraph [ref=e509]:
      - emphasis [ref=e510]: "Six calls on inputs that scale with physics or human arms, not with money: isotope purity, legacy radium, enriched stable targets, donated plasma, donated platelets, and the organ pool GLP-1 quietly drains."
    - paragraph [ref=e511]: "Every one of these six calls rests on the same structural move: a loud boom is funding the visible layer (curie count, fractionation plants, targeting ligands, reconditioning devices) while the binding constraint sits one layer upstream on an input that is physically or biologically non-manufacturable on the relevant timescale. Three are medical-isotope calls, but they name three genuinely different inelastic needles and must not be collapsed. The Ac-227 call is about isotopic inseparability: Ac-225 and Ac-227 are the same element in the same oxidation state, so every scaled accelerator route co-produces a radiotoxic impurity that no chemistry removes, and only the finite Th-229/U-233 generator stock is clean by construction. The Ra-226 call is about quantity: roughly 2.5 kg of legacy radium was ever extracted, the IAEA \"fix\" is a bounded gleaning of antique hospital sources rather than a manufacturing ramp, and building accelerators only intensifies competition for that fixed stock. The stable-isotope call is about geography: kilogram-scale gas-centrifuge enrichment of Yb-176, Zn-68 and Gd-160 (the targets that breed Lu-177, Cu-67, Tb-161) sits overwhelmingly in Rosatom cascades, and Western EMIS/laser rebuilds are gram-scale and isotope-narrow. The two donor-derived calls share the deepest physical truth: polyclonal IgG and platelet-lysate growth factors are not molecules you synthesize, they are pooled human repertoires whose therapeutic property is donor diversity, so supply is hard-bounded by eligible donors times a regulated max donation rate. The GLP-1 call inverts the consensus sign: by removing the metabolic and cardiovascular deaths that feed the marginal donor stream, GLP-1 degrades rather than improves the usable organ pool. Across all six, the pre-consensus seam is consistent and the clause probabilities are honestly held below the vision probabilities for one recurring reason: these constraints clear through government allocation tables, bilateral contracts, and informal hospital rationing rather than through Bloomberg-trackable spot prices, so the structural call can be correct while the dated, publicly-cited resolution criterion fails to print on schedule."
