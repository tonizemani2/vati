          - generic [ref=e116]: What we are watching
          - text: "Track monthly: (1) TrendForce/DRAMeXchange spot and contract DDR5 (16Gb-class) prices and the spot-minus-contract spread, since spot rolls over first; (2) memory-maker inventory days and contract-negotiation tone on quarterly calls; (3) consumer/enterprise bit-demand revisions and any disclosed double-order cancellations; (4) new-fab wafer-start ramp timing (Micron Idaho, Samsung P4L) versus plan; (5) HBM wafer-allocation share, since a pause in the HBM grab frees commodity DRAM bits."
        - generic [ref=e117]:
          - generic [ref=e118]: What would prove us wrong
          - text: DDR5 fails to fall 35%+ from its H1-2026 peak by 2027-12-31 because either (a) the named fab supply (Micron Idaho, Samsung P4L) slips materially past 2027 while HBM wafer cannibalization deepens, keeping commodity DDR5 starved, as Nomura and Bernstein argue with meaningful new supply not arriving until early 2028 and most new capacity earmarked for HBM not commodity DRAM, or (b) AI/datacenter DRAM demand accelerates enough to absorb all new bit supply with no inventory unwind. Either keeps the spike intact and falsifies the top.
        - generic [ref=e119]:
          - generic [ref=e120]: If the call is right, here is what moves
          - paragraph [ref=e121]: "While the spike holds, rent sits with the three memory makers, Samsung, SK Hynix and Micron, who reallocated wafers to HBM (1GB HBM consumes ~4GB of standard-DRAM wafer area) and pushed DDR5 contract prices up roughly 90-100% QoQ. When new bit supply from mid-2027 (Micron Idaho/Boise, Samsung P4L) lands on double-ordered channel inventory, that rent reverses and flows back to memory buyers: PC and handset OEMs whose memory BOM jumped (HP's CFO put memory/storage at ~35% of PC BOM in 2026, up from 15-18%) get margin relief, and the makers eat falling ASPs on freshly added capacity."
          - generic [ref=e122]:
