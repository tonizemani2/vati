              - generic [ref=e167]: Acid-short Indonesian MHP producers (Huafei, which put ~half its 120kt Weda Bay capacity into care and maintenance May 1; curtailed Huayou, Lygend and Tsingshan lines) whose feedstock is now 65-70% of MHP cash cost.
