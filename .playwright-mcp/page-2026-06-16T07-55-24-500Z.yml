          - generic [ref=e426]: If the call is right, here is what moves
          - paragraph [ref=e427]: "If the byproduct base shrinks structurally, the rent lands on whoever controls non-fossil merchant acid: integrated copper and zinc smelters that capture acid as a byproduct and can sell it. Codelco, Glencore (via the Codelco-Glencore Chilean smelter venture and Noracid), and Japanese and Korean smelters (Sumitomo, Korea Zinc) move from treating acid as a disposal cost to selling a scarce input near MHP economics. Producers who own captive acid alongside their nickel or phosphate plants keep the margin internally rather than paying spot."
          - generic [ref=e428]:
            - generic [ref=e429]:
              - heading "Who gains" [level=5] [ref=e430]
              - generic [ref=e431]: "Codelco and the Codelco-Glencore Chilean smelter venture (incl. Noracid): Smelter-byproduct acid is set by copper throughput, not by sulfur, so as the involuntary refinery stream falls these producers hold the cheapest growing source of non-fossil merchant acid and sell it into both Chilean SX-EW and the Indonesian HPAL import bid."
              - generic [ref=e432]: "Japanese and Korean smelters supplying Indonesia (Sumitomo Metal Mining, Korea Zinc): Indonesian HPAL has already pivoted to sourcing acid from Japan and Korea after Middle East and China cutoffs; whoever holds smelter acid on the Pacific arc collects a premium for tonnes that previously moved at disposal-level prices."
