        - generic [ref=e461]:
          - generic [ref=e462]: If the call is right, here is what moves
          - paragraph [ref=e463]: "Rent lands with the small set of firms that own EHV energization and HVDC commissioning crews and cannot have that headcount cloned by competitors: Quanta Services (which bought Northwest Lineman College precisely to internalize this pipeline) and Kiewit on the line and substation side, and Hitachi Energy and Siemens Energy on the converter-station commissioning side. As HVDC builds like Grain Belt Express, Champlain Hudson Power Express, and SOO Green reach the energization phase, the schedule-critical hours bill against this thin crew pool, so the margin moves from materials and routine construction into the day-rate of the commissioning lead. The developer (Invenergy, Grid United, NextEra) pays the premium and the crew-owning EPC and the two converter vendors capture it."
