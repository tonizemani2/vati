        - heading "By 2035 sulfuric acid, set by involuntary fossil-fuel desulfurization that shrinks as the world decarbonizes, becomes the explicitly cited binding gate on at least one HPAL battery-nickel or phosphate-fertilizer expansion, with a sustained real price step-change that outlasts the 2026 acute shocks rather than reverting with them." [level=3] [ref=e415]
        - generic [ref=e416]:
          - generic [ref=e417]: structural case 78%
          - generic [ref=e418]: our call 46%
        - generic [ref=e419]:
          - generic [ref=e420]: The binding constraint
          - text: Non-fossil-byproduct or smelter-sourced merchant sulfuric acid available to HPAL and phosphate plants, and the involuntary byproduct sulfur stream behind it. The inelastic input is the sulfur/acid molecule, not nickel ore, phosphate rock, leach autoclaves, or fertilizer plant capacity.
        - generic [ref=e421]:
          - generic [ref=e422]: What we are watching
          - text: Track (1) benchmark sulfur (Vancouver and Middle East) and merchant sulfuric-acid prices in real terms versus the 2024-2025 average, separating the 2026 shock spike from the post-shock baseline; (2) any HPAL battery-nickel or phosphate-fertilizer expansion publicly citing acid or sulfur availability, not ore, capital, or offtake, as the binding constraint; (3) global byproduct sulfur output trend as refining and sour-gas throughput evolve; (4) pace of any new Frasch, pyrite, or smelter-acid capacity. Resolves TRUE if by 2035-12-31 merchant sulfuric acid sustains a greater-than-40-percent real premium over the 2024-2025 average for at least four consecutive quarters in a window that is not attributable to an acute supply shock, AND at least one HPAL or phosphate expansion publicly cites acid or sulfur supply as the binding gate.
        - generic [ref=e423]:
          - generic [ref=e424]: What would prove us wrong
          - text: Byproduct sulfur stays ample through 2035 because refining and sour-gas throughput do not fall enough to tighten the structural base, and real acid prices revert to within 20 percent of the 2024-2025 average once the 2026 Hormuz, China and Russia shocks clear, OR battery chemistry shifts decisively away from HPAL nickel (LFP and sodium-ion dominance) while phosphate demand plateaus, collapsing the combined acid pull, OR low-cost non-byproduct acid (new Frasch, pyrite, or smelter capacity) scales fast enough to fill the gap.
