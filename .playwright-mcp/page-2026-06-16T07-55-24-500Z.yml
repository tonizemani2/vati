        - heading "US transmission and HVDC buildout in the 2030s binds on the narrow EHV energizing-and-commissioning craft, not the broadly-priced generic electrician shortage. The binding input is the journeyman and commissioning lead who can live-line and energize EHV lines and converter stations, and roughly half the utility line/substation cohort retires by 2030." [level=3] [ref=e451]
