              - heading "Who gains" [level=5] [ref=e160]
              - generic [ref=e161]: Sulfide-route and recycling-route Class-1 sulfate producers (Vale, Glencore, Norilsk Nickel, plus battery recyclers like Redwood and Li-Cycle) that make sulfate without HPAL acid intensity and collect the scarcity premium.
              - generic [ref=e162]: LFP cell makers and their backers (CATL, BYD) whose iron-phosphate chemistry needs no sulfate nickel, widening the LFP-versus-NCM cost gap in LFP's favor.
              - generic [ref=e163]: Indonesian HPAL operators with captive acid coming online (Huayou's pyrite/phosphogypsum acid projects due end-2026) who restart at a structurally higher payable while peers stay curtailed.
