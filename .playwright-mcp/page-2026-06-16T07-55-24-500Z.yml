  - generic [ref=e556]:
    - generic [ref=e557]: space and the space economy (launch vehicles and propulsion,
    - 'heading "Where the Space Economy''s Rent Goes Next: Six Physical Walls Cheap Launch Cannot Move" [level=2] [ref=e558]'
    - paragraph [ref=e559]:
      - emphasis [ref=e560]: Make orbit nearly free and scarcity jumps to the inputs that answer to thermodynamics, decay physics, and treaty-fixed spectrum, not to learning curves.
    - paragraph [ref=e561]: "We see the same trade six times, and the market misreads it the same way each time. The funded, visible bottleneck in space is always transport: launch cost, cadence, landers, GPUs. Cheap reusable launch is collapsing that layer, and the market is pricing the collapse as if it fixes the whole stack. It does not. It moves the binding constraint onto a short list of inputs that ride no learning curve because a physical or institutional invariant pins them. In vacuum, heat rejection is fixed by Stefan-Boltzmann T-to-the-fourth (P1). The 354-hour lunar night sets a linear energy-storage mass floor that only fission escapes (P2). Deep-space links need treaty-protected S/X/Ka bands and 70 m steel that takes a decade to pour (P3). LEO position error is driven by thermospheric density that a near-dead, non-commercial sensor base cannot forecast (P4). Every US radioisotope heat source is clad in one arc-remelted iridium alloy from a single reconstituted ORNL line, now bidding against the hydrogen buildout for the same 7-tonne-per-year metal (P5). And the stratosphere is a finite, 30-year-clearance alumina sink that a self-replacing megaconstellation fills monotonically (P6). In each case the scarce thing is one inelastic input: square-meters of deployable radiator per kilowatt, kilograms of night-survival storage per watt, large-aperture antenna-hours, in-situ density data, qualified iridium clad-vent-set throughput, qualified non-aluminum demisable structure. And in each case capital is still pricing the layer above it. The themes are getting loud (cooling is hard, Pu-238 is short, reentry chemistry sits in geoscience papers); the specific rent-bearing inputs are mispriced, absent from any equity model, sell-side note, or futures contract. We think that gap, between an audible theme and an unpriced input, is the whole edge."
