        - generic [ref=e194]:
          - generic [ref=e195]: The binding constraint
          - text: Qualified non-China copper smelting and refining capacity. The dated catalyst is the zero-to-negative treatment-charge regime (2026 benchmark at zero per tonne, spot near minus 78 per tonne) persisting and forcing ex-China smelter curtailments and closures through the late 2020s, leaving allied refining as the gating node by the early 2030s.
        - generic [ref=e196]:
          - generic [ref=e197]: What we are watching
          - text: "Track now: (1) the annual copper smelter TC/RC benchmark and the spot TC/RC index (zero or negative equals stress; 2026 benchmark confirmed at zero per tonne, spot near minus 78 per tonne April 2026); (2) announced curtailments, closures, or state bailouts of smelters in the US, EU, Japan, Korea, Australia, Chile, Zambia and Canada (baseline already includes the Glencore Australia rescue and Vedanta Zambia shutdown); (3) ex-China share of global refined-copper output (China about 60 percent of output on about 97 percent of capacity) and ramp rates at Adani Mundra and Freeport Manyar; (4) any US, EU or allied policy action explicitly framed to protect or rebuild domestic smelting capacity, against the Columbia CGEP proposal as a marker."
        - generic [ref=e198]:
          - generic [ref=e199]: What would prove us wrong
          - text: "By 2033-12-31, treatment and refining charges have recovered durably to positive double-digit dollars per tonne AND ex-China smelting capacity is stable or growing with no net additional Western or allied smelter closures or curtailments beyond those already announced by mid-2026 and no allied policy intervention specifically framed to protect smelting; OR new non-China refining capacity (notably Adani Mundra at 0.5 to 1.0 Mt and Freeport Manyar at 0.48 Mt scaling to design rates, plus further Indian or Indonesian builds) reaches utilization sufficient that allied refining stops being the binding gate on Western copper. Note: because negative charges are driven by a concentrate shortage, a durable concentrate-supply recovery that lifts charges back positive without any Western closures also kills the thesis."
        - generic [ref=e200]:
          - generic [ref=e201]: If the call is right, here is what moves
          - paragraph [ref=e202]: Value lands with the few smelters that survive the cull as qualified non-China refined-copper sellers and can re-rate their conversion margin once charges turn positive again. The rent sits with byproduct-rich and state-backed survivors (Codelco-Ventanas-type assets, Aurubis in Germany, Japan's Pan Pacific Copper, Korea Zinc, and the ramping Indian and Indonesian plants if they secure concentrate), not with the miners who still capture mine-side scarcity. A formal allied subsidy or floor mechanism transfers public capital directly onto the surviving Western and allied refineries.
