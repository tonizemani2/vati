        - generic [ref=e77]:
          - generic [ref=e78]: The binding constraint
          - text: The ~1Mt of marginal polysilicon capacity that the GCL/Tongwei fund was meant to permanently shut, now legally blocked from coordinated retirement by SAMR's January 2026 prohibition. The binding constraint is that no lawful coordination tool exists, sitting on top of a ~300 GW-equivalent (570kt) inventory overhang that has to clear through demand rather than supply cuts.
        - generic [ref=e79]:
          - generic [ref=e80]: What we are watching
          - text: Monthly China mono-grade polysilicon spot price (RMB/kg, OPIS / InfoLink / Bernreuter; n-type ~33.5 RMB/kg on 2026-06-10); national polysilicon inventory tonnes (>570kt); any new SAMR-approved or state-directed capacity-retirement vehicle or price floor; producer utilization and announced idling.
        - generic [ref=e81]:
          - generic [ref=e82]: What would prove us wrong
          - text: China consummates an industry-wide capacity-shutdown or state-backed acquisition fund that permanently retires ~1Mt, OR an anti-involution law / binding production quotas / a price floor that survives antitrust takes effect, OR demand draws inventory down fast enough that mono-grade spot averages above 45 RMB/kg for a sustained run (two-plus consecutive months) before 2027-12-31. A real break above ~50 RMB/kg sustained for two-plus months is the early warning the call is wrong.
        - generic [ref=e83]:
