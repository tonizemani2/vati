          - generic [ref=e114]: The binding constraint
          - text: "The dated supply step-up: Micron Idaho/Boise first output mid-2027 plus Samsung P4L wafer expansion and the broader DRAM bit-supply ramp, landing on a market that pulled demand forward through double-ordering. Run in reverse, the binding input is bit-supply growth hitting a channel already carrying hoarded inventory that has to unwind."
