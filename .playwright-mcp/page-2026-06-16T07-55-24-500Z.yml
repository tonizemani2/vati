              - heading "Who gains" [level=5] [ref=e124]
              - generic [ref=e125]: PC and smartphone OEMs (Dell, HP, Lenovo, Apple, Samsung's handset arm) who reverse 2026 price hikes into volume recovery as DDR5 unit cost falls back toward normal once spot rolls over.
              - generic [ref=e126]: Hyperscalers and server OEMs (HPE, Supermicro) that did not lock multi-year fixed contracts, repricing memory down as the channel destocks.
              - generic [ref=e127]: Memory-buying contract manufacturers and module houses that bought forward and sell into a falling spot, capturing the spot-to-contract gap as it compresses.
            - generic [ref=e128]:
              - heading "Who loses" [level=5] [ref=e129]
              - generic [ref=e130]: Micron, SK Hynix and Samsung memory divisions, whose record fiscal-2026 capex lands as ASPs fall, the classic hog-cycle margin crush once bits land into a destocking channel.
              - generic [ref=e131]: Distributors and OEMs that double-ordered at peak (near $20/chip spot) and carry hoarded DDR5 inventory that has to be written down as spot leads contract lower.
              - generic [ref=e132]: Equity holders positioned for a 'structural repricing of memory' (the Gartner/Nomura/Bernstein supercycle camp), repriced as the cycle behaves like 2017-18 and 2021.
