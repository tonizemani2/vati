          - generic [ref=e156]: If the call is right, here is what moves
          - paragraph [ref=e157]: If the sulfate-over-LME premium blows past $4,500/t while the LME stays surplus-capped on Class-2 NPI/FeNi, rent migrates from the LME metal to whoever controls battery-grade nickel sulfate that does not depend on acid-intensive Indonesian HPAL. That means sulfide-route refiners and recyclers who make sulfate without buying Middle East sulfur, plus LFP cell makers whose nickel-free chemistry sidesteps the cost step entirely. The acid-short Indonesian MHP producers and the high-nickel NCM cell makers and OEMs who must keep buying sulfate-grade nickel eat the cost.
