              - generic [ref=e473]: "Data-center developers competing for the same regional craft: Their fit-out timelines assume an undifferentiated electrician pool; once EHV energization crews command a premium, the broader skilled trade reprices around them and on-site labor escalates against fixed-price interconnect commitments."
              - generic [ref=e474]: "Regulated utility ratepayers in MISO and PJM transmission corridors: Commissioning-labor premiums on bulk-grid projects pass through utility O&M and rate base, repricing transmission service charges upward where these projects land first."
          - generic [ref=e475]: What reprices
          - paragraph [ref=e476]: No clean isolated instrument prices this input. Quanta Services equity (PWR) is the least-bad listed proxy and moves up, but it is diluted by its broader construction book. The cleaner observable is contractor day-rate and lead time for EHV/HVDC commissioning crews diverging upward from the BLS journeyman electrician wage series (~$59.50/hr), which is exactly the metric the call says is not yet separately tracked. Until a distinct EHV-commissioning rate series exists, the reprice shows up inside EPC bid line items and converter-station change orders, not in a public price.
