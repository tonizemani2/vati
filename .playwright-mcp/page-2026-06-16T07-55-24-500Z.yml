  - generic [ref=e781]:
    - generic [ref=e782]: semiconductors and the chip supply chain (logic foundry, mem
    - 'heading "Where chip-supply rent moves next: eight inelastic nodes, six we''d back" [level=2] [ref=e783]'
    - paragraph [ref=e784]:
      - emphasis [ref=e785]: The constraint that binds is rarely the monopoly everyone names. It is the artisanal sub-step, the byproduct metal, the second-decade engineer, and the isotope cascade that money cannot ramp on a fab timeline.
    - paragraph [ref=e786]: "All six calls share one shape. Capital, tools, and wafer capacity can all be bought on a capex clock, but the real ceiling sits a layer or two below the priced story, at an input whose supply grows on a physical or biological clock instead of a financial one. Three of the six are tacit-knowledge or labor constraints (Zeiss Oberkochen optics figuring, senior yield and integration engineers, certified UHP hookup welders), where supply is set by how fast a human banks a decade of on-line experience or a trade certifies a fitter, and neither parallelizes with money. Two are single-vendor or single-site equipment chokepoints (Zeiss again, IMS multibeam mask writers), where lead times of 18 to 36 months and no second qualified source cap how fast output can rise. Two are geologically or isotopically inelastic materials (ruthenium as a 30 t/yr platinum byproduct with no primary mine, enriched Si-28 from export-controlled separation cascades). The edge is not that these inputs are unknown. It is that the equity and policy channels price the wrong unit. They price ASML the company, not Zeiss the polishing bench. They price the fab as capex, not the engineer who carries the yield curve. They price the metal, not the chip-ramp risk it gates. The strongest calls keep two questions separate: is the physical mechanism real and inelastic, and does the specific dated, disclosure-dependent trigger actually fire. The lower second numbers honestly reflect substitution routes (molybdenum for ruthenium, Cu-Cu hybrid bonding for solder, superconducting qubits for silicon spin) and the fact that several triggers depend on a public disclosure supply chains may choose to manage quietly."
