          - generic [ref=e551]: Earliest sign it has begun
          - paragraph [ref=e552]: "The earliest dated marker is a national blood service publishing a restricted-allocation or shortage communication that attributes O-negative scarcity to the donor-versus-recipient demographic shift rather than to a one-off event, paired with O-neg days-of-supply printing below crisis thresholds on consecutive reporting cycles (NHSBT already ran group-O Amber alerts through 2025 with O-neg at 3.4 days in June 2025; the trigger is the moment the framing in those notices turns from recruitment-fixable to demographically-locked). A second confirming marker: a national service formalizing routine RhD-positive transfusion of D-negative men and over-50 women as standing policy rather than emergency exception."
