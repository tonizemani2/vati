  - generic [ref=e178]:
    - generic [ref=e179]: any area, wide open across all industries
    - 'heading "Where the Rent Moves Next: Four Binding Constraints Capital Has Not Yet Found" [level=2] [ref=e180]'
    - paragraph [ref=e181]:
      - emphasis [ref=e182]: The shortage everyone funds is at the factory. The rent has already moved on, to the deck of the ship, the certified hands, and the isotope nobody in the West can legally make.
    - paragraph [ref=e183]: "We see the same shift play out across all four calls, in four different physical systems. Capital and headlines crowd into the fast, fundable, capital-intensive layer (cable plants, copper mines, fusion magnets, grid transformers). Once that layer clears, the binding constraint does not disappear. It moves one node downstream onto something money cannot mint on the same clock. In three of the four cases that residual node is people or a permitted process, not steel. Certified offshore HV jointers, settings-grade protection-and-control relay engineers, journeyman linemen: a multi-year, retiring, non-compressible apprenticeship pipeline sits under every cable, substation, and interconnection. In copper the residual is qualified non-China smelting capacity, irreversible multi-billion-dollar assets being culled asymmetrically while the market still trades a mine-and-demand story. The Li-6 fusion call is the cleanest version of the pattern: the input is physically required, its only scaled production route is treaty-banned, and live capacity sits with two adversary states. The price channel is the giveaway every time. The market is paying for the hardware layer, while the genuinely inelastic node has no liquid market anyone trades, which is exactly why we think it is the live edge. The honest tax, the reason the probability on the exact dated version sits well below our conviction in each thesis, is that these are conjunctive, dated calls and the downstream node always has one elasticity leak: offshored relay-settings work, robotic jointing, new state-backed Asian smelters, or a natural-lithium blanket redesign."
