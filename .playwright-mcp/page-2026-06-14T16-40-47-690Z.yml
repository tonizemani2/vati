          - text: "Night-survival energy/power mass per continuous watt across the 354-hour lunar night (kg per continuous-watt for the storage route; equivalently, the count of qualified, flight-ready fission surface power units for the only route whose mass does not scale with night length). Not \"lunar power\" as a theme: the specific inelastic input is bridge-the-night mass-per-watt, and the single-sourced reactor program that escapes it."
        - generic [ref=e179]:
          - generic [ref=e180]: Leading metric
          - text: "(a) Count of fission surface power units that pass qualification and are manifested for lunar delivery (today: zero flown; one US program targeting Q1 2030 after slipping from 2026; design spec >=100 kWe, under 6 tonnes). (b) Best demonstrated night-survival energy-storage specific energy for a flight-qualified lunar system in Wh/kg including thermal keep-alive (today effectively battery-only, roughly 100-150 Wh/kg derated). (c) Count of non-polar lunar surface assets demonstrating continuous operation through a full lunar night at >=1 kW. Leading tell: any lander or base program that names night-survival power (not landing mass or launch cadence) as the schedule-gating line item, and any reactor-program slip past 2030."
