        - 'heading "Every kilowatt-class non-polar lunar surface asset through 2040 is gated by the 354-hour lunar night: the binding constraint is night-survival energy-storage mass per continuous watt, which forces fission surface power as the only viable route at useful power levels, and that route is single-sourced and schedule-fragile." [level=3] [ref=e172]'
        - paragraph [ref=e173]: "The 2025-2026 lunar narrative is a transport story: Starship cadence, Artemis flight rates, who lands what mass when. The wall nobody is pricing is that landing the mass is the easy half. Keeping any non-polar surface asset alive through 14.77 Earth days of continuous darkness, every month, is the hard constraint. NASA's own analysis puts the battery mass to bridge a single lunar night at ~16 metric tonnes for 40 kW of continuous power -- a mass that exceeds most landers' entire payload, for power a single data-center rack exceeds. Fission is the only source whose delivery mass does not scale with night length, which is why it becomes mandatory above a few hundred watts continuous. The US fission surface power program has already slipped from a 2026 target to 2030, the power spec jumped from 40 kW to over 100 kW with the same sub-6-tonne mass cap, and the January 2026 NASA/DOE MOU reset to a fresh downselect-to-two-designs process. The addressable set of continuously-powered lunar surface assets is therefore capped at the reactor count, regardless of how many landers fly."
