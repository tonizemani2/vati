  - generic [ref=e142]:
    - generic [ref=e143]: space and the space economy (launch vehicles and propulsion,
    - 'heading "Where the Space Economy''s Rent Migrates: Six Physical Walls Cheap Launch Cannot Move" [level=2] [ref=e144]'
    - paragraph [ref=e145]:
      - emphasis [ref=e146]: When you make getting to orbit free, scarcity jumps to the inputs that obey thermodynamics, decay physics, and treaty-fixed spectrum, not learning curves.
    - paragraph [ref=e147]: "Every one of these six calls follows the same migration logic and the consensus misses it the same way. The funded, visible bottleneck in space is always transport: launch cost, cadence, landers, GPUs. Cheap reusable launch is collapsing that layer, and the market is pricing the collapse as if it solves the whole stack. It does not. It relocates the binding constraint to a small set of inputs that do not ride any learning curve because they are pinned by a physical or institutional invariant: radiative heat rejection in vacuum is fixed by Stefan-Boltzmann T-to-the-fourth (P1); the 354-hour lunar night sets a linear energy-storage mass floor that only fission escapes (P2); deep-space link budgets need treaty-protected S/X/Ka bands and 70 m steel that takes a decade to pour (P3); LEO position uncertainty is dominated by thermospheric density that a near-dead, non-commercial sensor base cannot forecast (P4); every US radioisotope heat source is clad in a single arc-remelted iridium alloy from one reconstituted ORNL line now bidding against the hydrogen buildout for the same 7-tonne-per-year metal stream (P5); and the stratosphere is a finite, 30-year-clearance alumina sink that a self-replacing megaconstellation fills monotonically (P6). In each case the needle is a specific inelastic input (square-meters of deployable radiator per kilowatt, kilograms of night-survival storage per watt, large-aperture antenna-hours, in-situ density-driver data, qualified iridium clad-vent-set throughput, qualified non-aluminum demisable structure) and in each case capital is still pricing the layer above it. The themes are now audible (cooling is hard, Pu-238 is short, reentry chemistry exists in geoscience papers); the quantitative, rent-bearing needles are not in a single equity model, sell-side note, or futures contract. That gap between an audible theme and an unpriced needle is the entire edge."
    - paragraph [ref=e148]:
      - text: "Full board (with sources and the adversarial refute notes):"
      - link "download PDF ↓" [ref=e149] [cursor=pointer]:
        - /url: space.pdf
    - generic [ref=e150]:
      - article [ref=e151]:
        - generic [ref=e152]:
          - generic [ref=e153]: P1
          - generic [ref=e154]: resolves 2034-12-31
        - heading "Orbital compute does not hit a launch-cost wall or a power wall first. It hits a radiator-area wall. The binding constraint on space-based AI compute through the 2030s is deployable, micrometeoroid-survivable heat-rejection AREA per launched kilogram, governed by Stefan-Boltzmann T-to-the-fourth and a hard ~few-kg-per-square-meter panel-plus-fluid-loop mass floor that does not ride a learning curve. Multi-gigawatt orbital data centers are physically uncoverable this decade, and the rent migrates to whoever owns large-area deployable-radiator and two-phase loop technology, not to whoever owns the GPUs or the launch." [level=3] [ref=e155]
        - paragraph [ref=e156]: The 2025-2026 orbital-data-center pitch (Starcloud raised $170M at $1.1B in March 2026, Lumen Orbit, China Three-Body, NVIDIA-in-orbit) rests on free sunlight and free cold space. Free sunlight is real. Free cooling is not. In vacuum the only way to dump heat is to radiate it, and a two-sided panel held near room temperature emits only ~600-650 W/m2. That is a physical constant, not an engineering target. Starcloud's own white paper concedes roughly 1,600 m2 of radiator PER MEGAWATT, and a 5 GW concept needs about 8 km2 of radiator, larger than Gibraltar. Every doubling of orbital compute requires a doubling of folded-then-deployed radiator that must survive micrometeoroids, atomic oxygen, and thermal cycling for years, at a panel-plus-working-fluid-loop mass floor of a few kg/m2 that has barely moved in 40 years. Chip power density keeps climbing, but radiator W/m2 is pinned by T-to-the-fourth and material emissivity. The two curves diverge forever. Orbital compute caps out one-to-three orders of magnitude below the gigawatt hype, and the scarce, rent-bearing asset is not the GPU, the solar array, or the launch slot. It is qualified large-area deployable radiator and its leak-proof two-phase transport loop.
        - generic [ref=e157]:
