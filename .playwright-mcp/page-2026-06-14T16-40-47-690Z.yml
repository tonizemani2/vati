          - generic [ref=e159]: clause 62%
        - generic [ref=e160]:
          - generic [ref=e161]: Binding constraint (the needle)
          - text: "Qualified deployable space-radiator AREA (m2 of micrometeoroid-survivable, fluid-loop-coupled panel) per kilowatt of waste heat rejected, and the ~2-7 kg/m2 areal-mass floor of the panel plus its pumped two-phase transport loop. Not 'cooling' as a theme: the specific inelastic input is deployable radiator area-per-kW and the loop hardware behind it."
        - generic [ref=e162]:
          - generic [ref=e163]: Leading metric
          - text: "Announced or as-built radiator area and radiator mass fraction of any orbital-compute spacecraft above ~100 kW IT load, expressed as m2 of radiator per kW rejected and as radiator-plus-loop mass as a share of dry mass. Track: (a) the largest single orbital-compute payload actually on orbit by power (currently sub-kW thermal on Starcloud-1, Nov 2025); (b) whether any flown system rejects >100 kW; (c) radiator areal mass in kg/m2 in flight hardware (currently ~3-7 kg/m2). Leading tell: every serious orbital-DC technical disclosure or teardown that names radiator area/mass (not power or launch) as the gating line item."
