        - paragraph [ref=e224]: "The plutonium-238 production ramp at Oak Ridge absorbs every headline and every GAO citation on why NASA cannot fly more outer-planet and lunar-surface missions. The metal that physically wraps every gram of that fuel is absent from the discussion. Each Pu-238 pellet sits inside a cup of DOP-26 iridium alloy (iridium with 0.3 to 0.5 percent tungsten plus trace aluminum and thorium), formed into a clad vent set. That cup performs the safety function that makes the source flyable: it contains the fuel through a launch-pad explosion or reentry impact and stops alpha-bred neutrons from escaping. There is no qualified substitute material and no second fabrication source. The clad-vent-set line at ORNL nearly lapsed and had to be reconstituted from scratch. Now layer on the upstream reality confirmed by live price data: iridium spot has risen 70% year-to-date in 2026 and 426% since 2020, driven by PEM hydrogen electrolysis demand already at 12% of world industrial consumption (up from 4% in 2021), with the hydrogen literature projecting 32 to 40 tonnes per year of PEM demand by 2030 against a hard physical ceiling of roughly 7 tonnes per year of global production, itself a byproduct of platinum mining that takes a decade to expand and was cutting output in 2024 and 2025. The space program draws only kilograms, but it draws a specific arc-remelted, drop-cast, single-crystal-controlled alloy from one reconstituted shop, and it is now bidding for the same metal against an energy-transition buyer willing to absorb any price. The binding constraint on deep-space and Artemis-era lunar power migrates off the fuel and onto the cladding alloy and the sole fabrication line that forms it into clad vent sets. By 2035 a flagship outer-planet or lunar-surface mission slips or descopes its RPS unit count with iridium DOP-26 clad-vent-set throughput, or the iridium feedstock itself, named as a cause in a program-status or supply-chain document."
