        - heading "Senior yield/process-integration engineers with multi-node sub-5nm ramp experience are the non-cloneable binding constraint on ex-Taiwan leading-edge output through the 2030s; capital and wafer capacity are financializable but a decade of hands-on ramp knowledge is not, and the rent migrates to whoever holds that headcount." [level=3] [ref=e284]
        - paragraph [ref=e285]: "Capital, EUV tools, and wafer capacity are all fundable on a capex timeline; the one input that is not is a human who has personally climbed the yield curve across several node generations at sub-5nm class. Process integration and yield-enhancement engineering is overwhelmingly tacit: contamination fingerprinting, defectivity root-cause, and parametric drift diagnosis are learned over 10-plus years on a running line and do not transfer from a textbook or a two-year program. The market prices a fab as steel, tools, and a node label, then assumes yield ramp follows on schedule. It does not. TSMC explicitly attributed Arizona production delays to skilled worker shortages and responded by flying in over 1,000 Taiwanese engineers on three-year assignments -- then the second Arizona plant slipped to 2027-2028. That is not a capex problem; it is a headcount-of-experienced-engineers problem. One-third of the US senior fab-engineer cohort is at or near retirement age (a fixed birth-cohort fact), degree enrollment in feeder programs lagged for years, and announced ex-Taiwan fab count is contractually committed. The mismatch between capex-speed fab buildout and biology-speed expertise accumulation is mechanical and already locked in by decisions already made."
