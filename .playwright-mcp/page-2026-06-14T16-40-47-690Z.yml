        - heading "By 2035 the binding constraint on IVIG/SCIG supply is the human source-plasma donor base, a demographically and geographically concentrated input with no recombinant substitute; structural rationing or allocation tightens in at least two major wealthy markets, and the US share of world plasma collection stays above ~65 percent even as global IG demand grows materially." [level=3] [ref=e430]
        - paragraph [ref=e431]: "Polyclonal IgG is the pooled antibody repertoire of thousands of donors. Unlike any monoclonal or recombinant biologic, it cannot be grown in a cell line because the therapeutic property is the diversity of the pooled-donor immune repertoire, not a single sequence. That biological fact is permanent and non-negotiable. Demand is being pulled upward by three compounding forces: aging populations with primary immunodeficiency, expanding approved neurology indications (CIDP, MG, multifocal motor neuropathy), and a growing population of cancer-immunotherapy survivors with secondary immunodeficiency. IG demand is tracking roughly 30 percent growth by 2030 and rising into the 2030s. Supply is litres of source plasma, 70 percent of which is collected from US compensated donors under regulatory and physiological frequency caps that set a hard ceiling on litres per donor per year. Each lot requires 7-12 months from collection to finished vial. The system cannot sprint. The rent concentrates in whoever controls donor-centre litres, and that input cannot be financialized, engineered, or scaled the way a factory can."
