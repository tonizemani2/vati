        - heading "The binding constraint on the US/EU fab buildout is not capital or tools but the tiny, slow-to-certify pool of UHP process-piping welders and hookup fitters; their scarcity makes the announced 2023-2030 leading-edge capacity schedule structurally undeliverable." [level=3] [ref=e318]
        - paragraph [ref=e319]: "A fab is two things: a building shell and an extraordinarily complex web of ultra-high-purity gas, chemical, slurry, and process-water distribution that must be orbital-welded, hooked up, and certified leak-tight to SEMI particle standards before a single tool runs. That hookup work is a distinct specialty trade, certifiable only after years of pipefitting experience plus fab-specific qualification to smooth-bore, crevice-free, helium-leak-tested standards. TSMC Arizona already slipped explicitly citing this: the company had to airlift roughly 500 Taiwanese hookup specialists because the regional certified pool was too thin for even one major fab. SEMI's own data show roughly 97 high-volume fabs launching globally in 2023-2025, with the largest US/EU share in history and all on overlapping schedules. The concurrent demand is a step-function; the certified-trade pool grows only at the rate the trades can train and qualify people, which is years. Rent migrates to the specialty UHP mechanical subcontractors and to the certified orbital-welder pool; the visible symptom is schedule slip clustered on the install/hookup phase, not on construction or tool delivery."
