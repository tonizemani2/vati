        - heading "By 2034, deep-space-band large-aperture antenna-hours are the binding supply constraint on missions past GEO, with demand already exceeding DSN capacity at peak and the structural deficit widening faster than new aperture can be fielded." [level=3] [ref=e189]
        - paragraph [ref=e190]: Cheap reusable launch and the Artemis crewed-lunar program drive a steep rise in deep-space mission count through the late 2020s and early 2030s. Each crewed Artemis flight competes directly for the same S/X/Ka antennas as science flagships (Mars relays, outer-planet orbiters, JWST commanding) during the same windows, creating hard contention spikes on top of a baseline that already exceeds capacity at peak by roughly 40%. The Goldstone 70 m dish (DSS-14) has been offline since September 2025 with no confirmed return date as of mid-2026, a live demonstration that supply has already failed in exactly the mode the call describes.
        - generic [ref=e191]:
          - generic [ref=e192]: vision 78%
          - generic [ref=e193]: clause 62%
        - generic [ref=e194]:
          - generic [ref=e195]: Binding constraint (the needle)
          - text: Large-aperture (34 m / 70 m class) antenna-hours on the ITU-protected deep-space S/X/Ka bands, jointly with those coordinated spectrum allocations and the trained operations staff needed to run them. Not LEO ground stations. Not relay satellites. Not launch slots.
        - generic [ref=e196]:
          - generic [ref=e197]: Leading metric
          - text: "(a) DSN demand-over-supply ratio: already reported at roughly 140% of capacity at peak by the 2023 NASA OIG audit, with the 2030s projection at 150% or above before new aperture comes online. (b) Count of missions reporting deferred, shortened, or descoped contact passes citing antenna contention rather than budget. (c) Number of operational 34/70 m-class deep-space-band apertures and their scheduled downtime: DSS-14 offline since September 2025 with no confirmed return. (d) ITU coordination filings for deep-space X/Ka as cislunar users multiply. Baseline state today: network already oversubscribed, the largest single dish offline for an indeterminate overhaul, demand curve steepening, and planned mitigations (LEGS cislunar antennas) acknowledged insufficient for the deep-space tier."
        - generic [ref=e198]:
          - generic [ref=e199]: Kill-criterion
          - text: "The call is dead if by 2034: (a) a fielded constellation of new large-aperture or phased-array deep-space ground assets multiplies effective deep-space aperture-hours enough that demand-over-supply falls durably below 1.0 with no mission citing tracking time as a limiter; OR (b) optical (laser) deep-space communication is qualified and adopted as the primary link modality for the bulk of deep-space data volume, bypassing the RF aperture and protected-band constraint entirely; OR (c) the lunar and deep-space mission manifest collapses to the point that demand falls back to a level the existing network can absorb without rationing. Any one dissolves the needle."
