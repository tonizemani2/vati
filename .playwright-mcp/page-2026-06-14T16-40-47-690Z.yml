      - article [ref=e202]:
        - generic [ref=e203]:
          - generic [ref=e204]: P4
          - generic [ref=e205]: resolves 2035-12-31
        - heading "By 2035, the binding constraint on operating proliferated LEO is not tracking sensors or autonomous-maneuver software but the accuracy of thermospheric neutral-density forecasts, and the inelastic input gating that accuracy is real-time in-situ upper-atmosphere driver data from a tiny, non-redundant, government-funded sensor base with no commercial supply." [level=3] [ref=e206]
        - paragraph [ref=e207]: "Cheap launch and proliferated LEO are read as a traffic-management problem solved by more radars or optical trackers and onboard autonomous collision avoidance. The unpriced second-order fact: position uncertainty in LEO is dominated by atmospheric drag, and drag is set by thermospheric neutral density, which the operational community cannot forecast 24-72h out to better than roughly 20-40 percent (worse during geomagnetic storms). As object count and maneuver rate explode (Starlink running roughly 1,000 avoidance maneuvers per day, about 144,000 in six months Dec 2024 to May 2025), the system does not choke on tracking or compute. It chokes on density-forecast error producing a flood of false-positive conjunctions (wasted propellant, wasted operator decisions) and a residual of missed true ones. The physical input that fixes this is assimilated near-real-time thermospheric density driven by in-situ measurements: solar-EUV irradiance monitors and direct upper-atmosphere density sensors (the accelerometer lineage of CHAMP/GRACE/GRACE-FO/SWARM, now largely aged out, leaving the documented \"thermospheric gap\"). This driver data is produced by a handful of single-string, government-budget-funded instruments with no commercial supply chain. Value and regulatory leverage migrate to whoever can fly a commercial accelerometer and EUV density-sensing layer and sell assimilated forecasts, because the entire autonomous-collision-avoidance investment thesis is physically downstream of this one inelastic measurement input."
        - generic [ref=e208]:
          - generic [ref=e209]: vision 72%
          - generic [ref=e210]: clause 52%
        - generic [ref=e211]:
          - generic [ref=e212]: Binding constraint (the needle)
          - text: "Real-time in-situ thermospheric neutral-density driver data (direct accelerometer-derived density plus solar-EUV irradiance) feeding assimilated short-horizon density forecasts. The specific scarce asset is the measurement base: GOES SUVI-class EUV monitors and the retired CHAMP/GRACE-FO/SWARM accelerometer density lineage with zero commercial successor in qualified operational supply as of 2026."
        - generic [ref=e213]:
          - generic [ref=e214]: Leading metric
          - text: "Operational thermospheric density forecast skill at 24-72h horizons (percent RMS error vs. assimilated truth) and the count of false-alert collision-avoidance maneuvers per active satellite per year attributable to density uncertainty. Baseline: density forecast error roughly 20-40 percent (much worse during storms); Starlink maneuver count climbing super-linearly. Secondary metrics: number of flying in-situ thermospheric density sensors (near zero post-SWARM), and any commercial density-data offtake contract signed by a major constellation operator."
        - generic [ref=e215]:
          - generic [ref=e216]: Kill-criterion
          - text: "Kill the call if by 2035 any of the following: (a) operational 72h thermospheric density forecast error falls below roughly 10 percent through model or assimilation advances WITHOUT a new in-situ measurement layer, meaning the constraint dissolved by software or data-assimilation and density data never became the named gate; (b) autonomous maneuvering at full constellation scale proceeds with operators not citing density-forecast uncertainty as a material driver of maneuver burden or screening cost; or (c) a commercial in-situ thermospheric density-sensing constellation reaches qualified operational supply and prices the data as an ordinary commodity, meaning the constraint is relieved and the rent accrues only briefly. Also kill if the constraint resolves via a new government-funded replacement mission (a SWARM follow-on) that keeps supply public and non-commercial, negating the rent-migration thesis even if the physical gap closes."
