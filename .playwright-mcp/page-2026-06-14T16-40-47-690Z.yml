        - heading "By 2038, the binding constraint on proliferated-LEO throughput is the stratosphere's finite alumina-absorption capacity, forcing a regulated migration to non-aluminum demisable structures as the scarce, rent-capturing input." [level=3] [ref=e240]
        - paragraph [ref=e241]: "Cheap launch and short orbital lifetimes turn every megaconstellation into a mass conveyor: all launched mass must eventually reenter and burn. The dominant structural material is aluminum, and its combustion product -- aluminum oxide -- is chemically stable, settles from the stratosphere on a roughly 30-year timescale, and activates chlorine catalytically (ozone loss) while contributing a persistent aerosol load. Reentry alumina already exceeded natural atmospheric aluminum by about 30 percent in 2022; full build-out of announced constellations implies roughly 360 metric tons per year of Al2O3 by the late 2030s. The stratosphere behaves as a finite sink with a slow clearance rate and a monotonically rising source -- a textbook binding cap. Once the deposition signal is measurable and attributable (mid-2030s), it becomes a regulated quantity the way CFCs were. That converts an unpriced externality into a hard cap on annual alumina injection, and the rent migrates to the inelastic input that keeps the conveyor running under the cap: spacecraft structures that fully demise without injecting alumina."
        - generic [ref=e242]:
