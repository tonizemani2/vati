        - heading "Enriched Si-28 isotope-separation cascade capacity becomes the gating substrate input for silicon-spin qubits and (if adopted) 3D-logic thermal relief, with world supply sitting at tens to low hundreds of kg/yr against a potential tons-per-year demand cliff by the early 2030s." [level=3] [ref=e335]
        - paragraph [ref=e336]: Two independent demand curves land on one isotope-separation step. Silicon-spin qubits from Intel, Diraq, Quantum Motion and peers require 99.99%+ Si-28 to suppress Si-29 nuclear-spin decoherence -- this is non-negotiable physics, not a preference. Separately, removing Si-29 and Si-30 from the silicon lattice boosts thermal conductivity 60-600% over natural silicon, which matters specifically for buried-device heat extraction in CFET and backside-power-delivery 3D stacks where junction temperatures are the binding physical limit. The enrichment process -- aerodynamic separation of silane or gas-centrifuge on SiF4 -- is the same physics as uranium enrichment, so it carries export controls, long permitting timelines, and high capital intensity. ASP Isotopes (ASPI) is the only disclosed Western commercial enriched-Si-28 supplier, with a Pretoria facility restarted in May 2026 after engineering fixes, first commercial shipments targeted Q3 2026, and capacity documented at greater than 80 kg/yr from one facility. Three named purchase agreements already exist on that output (a major U.S. semiconductor company, a large industrial gases company, a large U.S. buyer). Total world capacity including any Rosatom legacy output is on the order of low hundreds of kg/yr. Any scenario where silicon-spin qubits reach even modest commercial volume, let alone where Si-28 epi gets adopted for 3D-logic thermal relief, requires 10 to 100 times that output. Aerodynamic and centrifuge cascades are among the slowest industrial plants to permit and commission; $333M in ASPI cash begins to relax supply on a multi-year basis but does not dissolve the constraint inside a decade.
