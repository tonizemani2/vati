        - heading "Ruthenium becomes the gating input for advanced-logic interconnects as copper hits its resistivity wall at sub-2nm pitches, with supply hard-capped at roughly 30 tonnes per year as a platinum byproduct and no primary mine to develop." [level=3] [ref=e301]
        - paragraph [ref=e302]: "Copper interconnects fail by physics at wire dimensions below roughly 12-16 nm pitch: electron surface scattering and grain-boundary scattering blow up resistivity, and the barrier/liner layer that copper requires eats an ever-larger fraction of the shrinking cross-section. Ruthenium is the industry-chosen escape because it can be deposited barrierless, its resistivity degrades far less at nanoscale, and it is being designed into the tightest metal levels and backside-power-delivery vias at the A14 node and below, with ramp roughly 2027-2030. The chokepoint is that ruthenium is not mined directly. It is a byproduct of platinum-group-metal extraction, roughly 30 tonnes per year globally, geologically concentrated in South Africa's Bushveld and Russia's Norilsk, with output governed by platinum and palladium demand from autocatalysts and jewelry, not chip fabs. When Ru moves from trace use in hard disks and catalysts to coating the bottom interconnect levels and backside vias of every advanced GPU, CPU and HBM die, even a few extra grams per wafer times tens of millions of leading-edge wafers collides with that 30-tonne ceiling. Rent migrates from the foundry to whoever controls Ru refining and sputtering-target conversion."
