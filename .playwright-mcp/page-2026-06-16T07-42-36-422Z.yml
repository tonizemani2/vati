          - generic [ref=e352]: The binding constraint
          - text: Qualified blanket-grade enriched lithium-6 (Li-6 enriched well above the 7.5% natural abundance, typically 30-90%) produced by a Minamata-compliant, non-mercury industrial process outside Russia and China. The inelastic input is certified Li-6 enrichment capacity, not lithium metal, not tritium, not the blanket design.
