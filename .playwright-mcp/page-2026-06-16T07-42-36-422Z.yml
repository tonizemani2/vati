        - heading "Orbital compute does not hit a launch-cost wall or a power wall first. It hits a radiator-area wall. We think the binding constraint on space-based AI compute through the 2030s is deployable, micrometeoroid-survivable heat-rejection AREA per launched kilogram, governed by Stefan-Boltzmann T-to-the-fourth and a hard ~few-kg-per-square-meter panel-plus-fluid-loop mass floor that does not ride a learning curve. Multi-gigawatt orbital data centers are physically uncoverable this decade, and the rent goes to whoever owns large-area deployable-radiator and two-phase loop technology, not to whoever owns the GPUs or the launch." [level=3] [ref=e428]
