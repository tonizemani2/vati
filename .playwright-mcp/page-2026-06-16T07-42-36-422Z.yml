    - generic [ref=e63]: any area, wide open across all industries
    - heading "Three Commodity Reversals Where the Fix Is Already Paid For" [level=2] [ref=e64]
    - paragraph [ref=e65]: _The crowd is pricing the spike. We think the dated event that breaks it has already fired or is already under construction._
    - paragraph [ref=e66]: Our house view across this board is simple. In three separate commodity chains, the supply response the bulls are betting against has already been set off by a specific, dated event, and the market has not repriced how long or how hard the reversal runs. Take polysilicon. SAMR's January 2026 prohibition legally pulled the one tool that could have cut capacity, so the only way the market clears now is slow attrition with the price stuck below cash cost. In DRAM, the fabs that unwind the 2026 memflation spike are already committed concrete with mid-2027 completion dates (Micron Idaho, Samsung P4L), and they land onto a channel stuffed with double-ordered inventory that has to clear. In battery-grade nickel, two stacked acid shocks (the Hormuz closure plus China's May 1 sulfuric-acid export ban) are curtailing Indonesian MHP right now, so the chemical-grade chain is sliding into deficit while the headline LME metal stays in surplus. The thread tying them together is that the market is reading a price level set by an allocation choice or a coordination bet as a permanent regime change, when the physical and regulatory machinery for the reversal is already in place. Each call resolves inside 18 months against a hard, dated test, so the board scores within the year. The shared risk is just as clear, and it is about timing. In every case we like the direction, but the magnitude by the resolution date is the real coin flip, which is why on two of three we put the dated call near 0.45 even where our conviction in the thesis runs high.
