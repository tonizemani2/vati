        - generic [ref=e315]:
          - generic [ref=e316]: The binding constraint
          - text: "Extra-high-voltage and HVDC transmission commissioning and live-line craft labor: the journeymen, test and protection engineers, and energization leads who can commission and energize EHV lines, substations, and HVDC converter stations. Distinct from the general construction-electrician pool, and narrower still than the utility lineman cohort."
