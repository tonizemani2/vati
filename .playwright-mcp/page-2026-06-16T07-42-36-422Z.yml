          - generic [ref=e354]: What we are watching
          - text: "Track: (1) announced allied (non-Russia/non-China) enriched-Li-6 production capacity in t/yr contained Li-6, currently ~0 at industrial scale; (2) DOE or private-fusion fuel-cycle disclosures naming Li-6 supply as an explicit program gate; (3) any enriched-lithium offtake/supply contract signed by a private fusion company at a disclosed premium. TRUE if by 2034-12-31 at least one pilot/demo DT fusion plant publicly cites enriched-Li-6 availability (not plasma, magnets, or tritium) as a binding schedule constraint OR contracts blanket-grade Li-6 at a disclosed premium, AND no non-China/non-Russia plant has reached qualified industrial-scale (>1 t/yr contained Li-6) Minamata-compliant output."
