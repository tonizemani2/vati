    - 'heading "Where the constraint migrates in biotech: finite atoms and human donors that capital cannot replicate" [level=2] [ref=e628]'
    - paragraph [ref=e629]:
      - emphasis [ref=e630]: "Six calls on inputs that scale with physics or human arms, not with money: isotope purity, legacy radium, enriched stable targets, donated plasma, donated platelets, and the organ pool GLP-1 quietly drains."
    - paragraph [ref=e631]: "We make the same structural argument six times. In each case a loud, well-funded boom is paying for the visible layer (curie count, fractionation plants, targeting ligands, reconditioning devices) while the binding constraint sits one layer upstream, on an input that physics or biology will not let anyone manufacture on the relevant timescale. Three of these are medical-isotope calls, and we want to be clear they are not the same call: they name three genuinely different inelastic inputs. The Ac-227 call turns on isotopic inseparability. Ac-225 and Ac-227 are the same element in the same oxidation state, so every scaled accelerator route co-produces a radiotoxic impurity that no chemistry removes, and only the finite Th-229/U-233 generator stock is clean by construction. The Ra-226 call turns on quantity. Roughly 2.5 kg of legacy radium was ever extracted, the IAEA \"fix\" is a bounded gleaning of antique hospital sources rather than a manufacturing ramp, and building more accelerators only intensifies competition for that fixed stock. The stable-isotope call turns on geography. Kilogram-scale gas-centrifuge enrichment of Yb-176, Zn-68 and Gd-160 (the targets that breed Lu-177, Cu-67, Tb-161) sits overwhelmingly in Rosatom cascades, and Western EMIS and laser rebuilds remain gram-scale and isotope-narrow. The two donor-derived calls share the deepest physical truth. Polyclonal IgG and platelet-lysate growth factors are not molecules anyone synthesizes, they are pooled human repertoires whose therapeutic property is donor diversity, so supply is hard-bounded by eligible donors times a regulated maximum donation rate. The GLP-1 call flips the consensus sign. By removing the metabolic and cardiovascular deaths that feed the marginal donor stream, GLP-1 degrades rather than improves the usable organ pool. The seam is consistent across all six, and we hold the dated-call probabilities honestly below our conviction in the theses for one recurring reason: these constraints clear through government allocation tables, bilateral contracts, and informal hospital rationing rather than through Bloomberg-trackable spot prices, so the structural call can be right while the dated, publicly-cited resolution criterion fails to print on schedule."
