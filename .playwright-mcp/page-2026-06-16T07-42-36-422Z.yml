        - heading "Through 2034 the binding constraint on whole-mammalian-brain connectomes is not the electron microscope or the segmentation model. It is the human-proofread, error-audited gold reference set. Generative dense-segmentation auto-traces neurons faster every year but cannot self-certify, so verified ground-truth wiring becomes the scarce, slow-to-grow asset, with proofreading commanding the majority of every whole-brain project budget." [level=3] [ref=e239]
        - generic [ref=e240]:
          - generic [ref=e241]: structural case 82%
          - generic [ref=e242]: our call 46%
        - generic [ref=e243]:
          - generic [ref=e244]: The binding constraint
          - text: Expert-proofread, error-audited gold-standard connectome reference data (synapse-level verified wiring) plus the human annotator pool trained to inter-expert agreement that produces it. Not the multibeam EM scope, not the auto-segmentation model, not GPU compute. The new automation (Autoproof, ConnectomeBench LLMs) still consumes this exact reference set to train and check against, which raises its value rather than removing it.
        - generic [ref=e245]:
          - generic [ref=e246]: What we are watching
          - text: Share of total whole-brain connectome project budget and calendar time consumed by proofreading/verification (today reported >90-97% on whole-brain-scale efforts), plus cost per verified cubic millimeter and count of trained expert proofreaders. Resolves TRUE if through 2034 at least one whole-mammalian-brain (mouse-scale) program publicly reports proofreading/verification as the explicitly named gating item AND >80% of cost, and verified-reference cost per mm3 has not fallen by more than ~3x.
        - generic [ref=e247]:
          - generic [ref=e248]: What would prove us wrong
          - text: A self-certifying reconstruction reaches expert-agreement-grade accuracy on dense neurite topology with NO human proofreading (error rate on held-out human-verified volumes statistically indistinguishable from inter-expert agreement). The live optical-barcoding "$10M mouse brain if it eliminates proofreading" path is the sharpest such threat; OR proofreading drops below 50% of whole-brain budget before 2034 via automation (Autoproof-class methods already cut workflow cost ~80%); OR synthetic/self-supervised reference generation is shown to remove the circularity. Any one dissolves the constraint.
        - generic [ref=e249]:
          - generic [ref=e250]: If the call is right, here is what moves
          - paragraph [ref=e251]: Value lands with whoever owns the verified gold-reference volumes and the trained proofreader pool that produces them, not with the EM-scope vendors or the segmentation-model authors. Through 2034 that is the Princeton Seung lab plus the Allen Institute for Brain Science (the MICrONS and FlyWire reference corpora) and the human consortia, gamers, and contract annotators trained to inter-expert agreement around them. Every Autoproof-class automation and every ConnectomeBench-style LLM has to be trained and benchmarked against these exact human-verified volumes, so the reference set captures a recurring tax on each new tool release rather than being eroded by it.
          - generic [ref=e252]:
            - generic [ref=e253]:
              - heading "Who gains" [level=5] [ref=e254]
              - generic [ref=e255]: "Princeton Seung lab + Allen Institute for Brain Science (MICrONS / FlyWire reference corpora): They hold the largest existing expert-proofread synapse-level volumes, the one input every new auto-tracer and LLM proofreader must train and validate against, so each new model raises the corpus's value instead of replacing it."
              - generic [ref=e256]: "Specialized proofreading-labor operations and the trained annotator pool (FlyWire-consortium-style and contract teams): With proofreading >90% of budget and the trainable expert pool growing only linearly, the people certified to inter-expert agreement are the rate-limiting capacity; their billable person-years command the majority of every whole-brain grant."
              - generic [ref=e257]: "Autoproof-class tool builders that sell labor-compression on top of the gold set: They monetize the 80% workflow-cost cut without owning the bottleneck, capturing margin per proofreader-hour saved while remaining dependent on the human reference for training and held-out validation."
            - generic [ref=e258]:
              - heading "Who loses" [level=5] [ref=e259]
              - generic [ref=e260]: "Multibeam EM scope vendors and pure imaging-throughput plays: If imaging is $200-300M against $7-21B of proofreading, faster scopes shrink the small part of the budget and do not move the gate, so imaging capex gets repriced as a commodity input rather than the scarce asset."
              - generic [ref=e261]: "Pure auto-segmentation model groups pitching self-certifying reconstruction: A model cannot verify itself against the thing being checked, so 'better segmentation' alone delivers silent topology errors and still routes the budget to human proofreading, undercutting the model-centric funding pitch."
              - generic [ref=e262]: "Whole-mouse-brain program timelines and the grant lines that bought the 'AI will erase proofreading' framing (e.g. the Harvard-led BRAIN CONNECTS hippocampus effort): Budgets sized on transient-proofreading-cost assumptions overrun on the person-year curve, exposing those programs to schedule slip and to the NIH funding-priority squeeze already seen in early 2025."
          - generic [ref=e263]: What reprices
          - paragraph [ref=e264]: "Nothing prices this cleanly: there is no spot price, ticker, or sell-side model for verified connectome reference data. The instrument that actually moves is grant-budget allocation: the proofreading line of whole-brain program budgets stays >90% and grows in absolute person-years, while the imaging-capex line falls relative to it. The cleanest live anchor is the gap between the Wellcome roughly $10B/17-year mouse-brain estimate (>90-95% proofreading) and Rodriques's conditional $7-10M optical figure that holds only if proofreading is eliminated."
          - generic [ref=e265]: The next constraint it creates
          - paragraph [ref=e266]: Once verified gold-reference data binds, the constraint moves one layer deeper to the supply of humans trainable to inter-expert agreement on dense-neurite topology, and below that to the labeling protocol and arbitration standard that defines 'agreement' itself. Whoever sets and certifies that standard controls who can produce admissible reference data at all.
          - generic [ref=e267]: Earliest sign it has begun
          - paragraph [ref=e268]: "Earliest dated marker: a funded whole-mouse-brain or large-volume program publicly reports its FY2026-2027 budget with proofreading/verification named as the explicit gating line item at >80% of cost, or a major auto-tracer release (Autoproof-class) ships and is benchmarked against the MICrONS/FlyWire human-verified volumes rather than replacing them. The sharpest disconfirming counter-marker to track in parallel is E11 Bio's PRISM optical-barcoding roadmap publishing a held-out error rate statistically indistinguishable from inter-expert agreement with no human proofreading."
