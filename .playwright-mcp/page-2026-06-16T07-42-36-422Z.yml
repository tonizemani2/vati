          - generic [ref=e318]: What we are watching
          - text: "Contractor day-rate and lead time for EHV/HVDC commissioning crews versus general journeyman electrician wages; count of transmission/HVDC projects naming energization/commissioning labor (not permitting or equipment) as the schedule-limiting item. Now: general journeyman ~$59.50/hr and rising, broadly covered; EHV-commissioning labor not separately tracked or priced; ~half the utility line/substation workforce retirement-eligible by 2030; recruiter/EPC sources report ~3:1 demand-to-supply for HVDC commissioning skill."
