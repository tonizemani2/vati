  - generic [ref=e191]:
    - generic [ref=e192]: "cross-domain: critical materials, energy, biotech, AI-for-sc"
    - 'heading "Where the constraint moves next: six inelastic inputs the market has not priced" [level=2] [ref=e193]'
    - paragraph [ref=e194]:
      - emphasis [ref=e195]: Rent accrues to the binding input. These six calls name the specific molecule, isotope, donor body, or tacit craft that cannot scale on its price signal, and we mark exactly where each claim stops.
    - paragraph [ref=e196]: Every call here runs on one mechanism. A downstream system scales fast while one upstream input is fixed by physics, chemistry, demography, or treaty, so the rent migrates onto the input that cannot answer a price signal. Hafnium and sulfuric acid are byproduct-pinned trickles set by someone else's process (zirconium refining, fossil desulfurization), so you cannot make more without overmaking a product nobody wants, and both now face several inelastic buyers converging at once. Lithium-6 is fixed at 7.5 percent of natural lithium and its only volume-proven separation route is treaty-banned, which leaves a China/Russia duopoly two layers below the fusion plasma everyone watches. Blood and the EHV commissioning craft are demographic locks. The donor-eligible cohort and the 1980s-trained energization journeymen are already born and already shrinking while the consuming cohort grows, and you cannot manufacture a young vein or a four-to-seven-year tacit seasoning. Connectome proofreading flips the usual AI story on its head, because a better auto-segmentation model raises the value of the human gold reference it must be checked against rather than erasing it. The honest boundary across all six is the same. The structural mechanism is near-locked, but each dated trigger carries a real timing-and-measurement tax because a demand-side release valve, a crash program, or a wording threshold can blunt the exact resolution without touching the physics. We think the edge is the input, not the headline, and the discipline is keeping the trigger odds honest.
