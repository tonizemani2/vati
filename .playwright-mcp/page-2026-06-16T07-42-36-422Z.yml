        - heading "By 2034 the binding constraint on commercial DT fusion migrates one layer upstream of tritium onto blanket-grade enriched lithium-6, whose only proven industrial process (mercury COLEX) is treaty-banned and whose only current producers are Russia and China. The unpriced chokepoint is qualified, Minamata-compliant Li-6 enrichment capacity outside that duopoly, not plasma, magnets, or tritium." [level=3] [ref=e347]
