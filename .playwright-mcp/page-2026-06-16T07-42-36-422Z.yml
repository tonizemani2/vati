        - heading "By 2035 sulfuric acid, set by involuntary fossil-fuel desulfurization that shrinks as the world decarbonizes, becomes the explicitly cited binding gate on at least one HPAL battery-nickel or phosphate-fertilizer expansion, with a sustained real price step-change that outlasts the 2026 acute shocks rather than reverting with them." [level=3] [ref=e275]
        - generic [ref=e276]:
          - generic [ref=e277]: structural case 78%
          - generic [ref=e278]: our call 46%
        - generic [ref=e279]:
          - generic [ref=e280]: The binding constraint
          - text: Non-fossil-byproduct or smelter-sourced merchant sulfuric acid available to HPAL and phosphate plants, and the involuntary byproduct sulfur stream behind it. The inelastic input is the sulfur/acid molecule, not nickel ore, phosphate rock, leach autoclaves, or fertilizer plant capacity.
        - generic [ref=e281]:
          - generic [ref=e282]: What we are watching
          - text: Track (1) benchmark sulfur (Vancouver and Middle East) and merchant sulfuric-acid prices in real terms versus the 2024-2025 average, separating the 2026 shock spike from the post-shock baseline; (2) any HPAL battery-nickel or phosphate-fertilizer expansion publicly citing acid or sulfur availability, not ore, capital, or offtake, as the binding constraint; (3) global byproduct sulfur output trend as refining and sour-gas throughput evolve; (4) pace of any new Frasch, pyrite, or smelter-acid capacity. Resolves TRUE if by 2035-12-31 merchant sulfuric acid sustains a greater-than-40-percent real premium over the 2024-2025 average for at least four consecutive quarters in a window that is not attributable to an acute supply shock, AND at least one HPAL or phosphate expansion publicly cites acid or sulfur supply as the binding gate.
        - generic [ref=e283]:
          - generic [ref=e284]: What would prove us wrong
          - text: Byproduct sulfur stays ample through 2035 because refining and sour-gas throughput do not fall enough to tighten the structural base, and real acid prices revert to within 20 percent of the 2024-2025 average once the 2026 Hormuz, China and Russia shocks clear, OR battery chemistry shifts decisively away from HPAL nickel (LFP and sodium-ion dominance) while phosphate demand plateaus, collapsing the combined acid pull, OR low-cost non-byproduct acid (new Frasch, pyrite, or smelter capacity) scales fast enough to fill the gap.
        - generic [ref=e285]:
          - generic [ref=e286]: If the call is right, here is what moves
          - paragraph [ref=e287]: "If the byproduct base shrinks structurally, the rent lands on whoever controls non-fossil merchant acid: integrated copper and zinc smelters that capture acid as a byproduct and can sell it. Codelco, Glencore (via the Codelco-Glencore Chilean smelter venture and Noracid), and Japanese and Korean smelters (Sumitomo, Korea Zinc) move from treating acid as a disposal cost to selling a scarce input near MHP economics. Producers who own captive acid alongside their nickel or phosphate plants keep the margin internally rather than paying spot."
          - generic [ref=e288]:
            - generic [ref=e289]:
              - heading "Who gains" [level=5] [ref=e290]
              - generic [ref=e291]: "Codelco and the Codelco-Glencore Chilean smelter venture (incl. Noracid): Smelter-byproduct acid is set by copper throughput, not by sulfur, so as the involuntary refinery stream falls these producers hold the cheapest growing source of non-fossil merchant acid and sell it into both Chilean SX-EW and the Indonesian HPAL import bid."
              - generic [ref=e292]: "Japanese and Korean smelters supplying Indonesia (Sumitomo Metal Mining, Korea Zinc): Indonesian HPAL has already pivoted to sourcing acid from Japan and Korea after Middle East and China cutoffs; whoever holds smelter acid on the Pacific arc collects a premium for tonnes that previously moved at disposal-level prices."
              - generic [ref=e293]: "Vertically integrated phosphate producers with captive sulfur burners (OCP, Nutrien): Plants that make their own acid from contracted sulfur keep producing while merchant-acid-dependent competitors curtail, so they take share and pricing power as marginal supply is cut on acid cost."
            - generic [ref=e294]:
              - heading "Who loses" [level=5] [ref=e295]
              - generic [ref=e296]: "Indonesian merchant-acid HPAL operators (Huayou/Huafei, similar MHP lines): Acid is already 50 percent plus of MHP cash cost at 2026 prices and Huafei cut roughly 50 percent of capacity; a sustained structural premium pushes the high-cost end of the HPAL curve permanently uneconomic rather than temporarily idled."
              - generic [ref=e297]: "Mosaic and other US merchant-acid phosphate producers: Mosaic already cut about 2 Mt of phosphate output on acid cost; without captive low-cost acid a lasting premium keeps marginal US tonnes offline and cedes ground to integrated rivals."
              - generic [ref=e298]: "Spot-procurement Chilean SX-EW copper operators: Smaller Chilean leachers without multi-year acid contracts face the same molecule now bid by HPAL and fertilizer, so their cathode margin compresses and the lowest-grade leach ore becomes uneconomic to process."
          - generic [ref=e299]: What reprices
          - paragraph [ref=e300]: The cleanest moving instrument is the merchant sulfuric-acid benchmark (NE Asia CFR and Tampa/US Gulf), which steps up in real terms and, critically, fails to revert to within 20 percent of the 2024-2025 average after the 2026 Hormuz, China and Russia shocks clear. Vancouver and Middle East benchmark sulfur moves with it. There is no clean listed instrument that isolates the structural premium; it shows up secondhand as a widened, persistent acid line item in HPAL MHP cash-cost curves and phosphate margin guidance rather than in any forward acid contract that trades the decade view.
          - generic [ref=e301]: The next constraint it creates
          - paragraph [ref=e302]: "Once acid binds, the constraint moves one layer deeper to non-fossil acid-making capacity itself: new copper and zinc smelter acid plants, and the slow, capital-heavy Frasch and pyrite-roasting routes. Because adding that capacity is gated by copper smelter build-out (the Codelco-Glencore-class projects) and by permitting and capex on dedicated sulfur burners, the binding scarcity migrates from the molecule to smelter-acid plant commissioning slots and the sulfur-burner EPC queue."
          - generic [ref=e303]: Earliest sign it has begun
          - paragraph [ref=e304]: The earliest dated marker is a specific HPAL or phosphate expansion FID being deferred, downsized, or cancelled with acid or sulfur supply named as the binding reason in a public filing or investor call (not ore, capital, or offtake), in a quarter where benchmark acid is not attributable to an acute shock. The 2026 Huafei and Mosaic curtailments are the acute preview; the structural marker is a forward expansion citing acid as the gate after the 2026 shocks have visibly normalised.
