        - generic [ref=e109]: Will the average delivery lead time for a large power transformer exceed 130 weeks by end of 2027?
        - generic [ref=e111]: "Yes, I believe average lead times for large power transformers will exceed 130 weeks by end of 2027. **Why:** The binding constraint is **electrical steel (grain-oriented electrical steel, GOES)** capacity and **high-voltage bushing** manufacturing. Both have extremely inelastic supply: GOES requires specialized steel mills that take 3–5 years to bring online, and high-voltage bushings depend on a handful of global suppliers (ABB, Siemens, a few Chinese firms) with long qualification cycles. Demand is being driven by grid modernization, renewable interconnection, and data center buildout, all of which are capacity-constrained on the transformer assembly side. Transformer factories themselves are running at >90% utilization globally, but the true jam is upstream—core steel and bushing lead times have stretched from 12–16 weeks pre-2020 to 40–60 weeks now. Even if new transformer assembly lines open (which they are, slowly), they will compete for the same fixed GOES and bushing output, keeping assembly lead times high. Lead times today are around 100–120 weeks for large power transformers (>100 MVA, >230 kV). With no new GOES capacity coming online before 2027 (major expansions from Nippon Steel, AK Steel are all post-2028), and bushings back-ordered, drift to 130+ weeks is baked in."
