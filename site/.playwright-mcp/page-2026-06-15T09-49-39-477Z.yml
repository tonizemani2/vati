            - img [ref=e125]
          - generic [ref=e142]: "China's gallium refining dominance rests on an inelastic input: the integrated bauxite‑alumina‑gallium refining loop. The world builds new alumina refineries adjacent to bauxite mines, and gallium recovery is grafted onto that existing infrastructure. China owns most of that loop, and although export controls since 2023 have catalysed a handful of non‑Chinese primary‑gallium projects (Canada, Australia, US), the lead times to bring meaningful refining capacity online run 5–7 years. By end‑2027 only a trickle of new supply will register. Meanwhile China’s own primary output is not static; it can grow along with alumina, keeping the denominator filled. Recycling‑based gallium remains marginal, contributing single‑digit percentages globally and not enough to shift the share needle quickly. The binding constraint is therefore ready‑to‑go primary refining"
