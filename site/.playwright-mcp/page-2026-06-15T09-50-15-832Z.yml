          - generic [ref=e142]: "China's gallium refining dominance rests on an inelastic input: the integrated bauxite‑alumina‑gallium refining loop. The world builds new alumina refineries adjacent to bauxite mines, and gallium recovery is grafted onto that existing infrastructure. China owns most of that loop, and although export controls since 2023 have catalysed a handful of non‑Chinese primary‑gallium projects (Canada, Australia, US), the lead times to bring meaningful refining capacity online run 5–7 years. By end‑2027 only a trickle of new supply will register. Meanwhile China’s own primary output is not static; it can grow along with alumina, keeping the denominator filled. Recycling‑based gallium remains marginal, contributing single‑digit percentages globally and not enough to shift the share needle quickly. The binding constraint is therefore ready‑to‑go primary refining capacity outside China, and that capacity will still be measured in tens of tonnes in 2027 against a global market of ~800 t, leaving China well above 90 %. Still, genuine uncertainty sits in how forcefully Western governments subsidise alternatives and whether China itself deliberately curtails output (or materially misreports). The median path is a slow erosion from ~98 % to the mid‑90s, with a low‑end tail that might graze 90 % if non‑Chinese projects over‑deliver ahead of schedule."
