        - generic [ref=e111]: "Where does the binding constraint in AI move next: chips, power, or data? Give me your call with a probability."
        - generic [ref=e112]: "**The binding constraint moves to power within 24 months.** **Current constraint:** High-end chips (H100/B200 supply). This is easing as CoWoS capacity ramps and custom ASICs proliferate. Markets have priced this in. **Next constraint:** Data center electricity, specifically **interconnection capacity** (the physical ability to draw hundreds of megawatts from the grid at a single point) and **transmission build-out timelines**. The elasticity of chip supply is now higher than power delivery timelines. **Causal chain:** - **Frontier capability:** Training runs double model size every 4-5 months; inference cost drops make AI load grow exponentially. - **Dependency graph:** Chips → power → cooling → data center shells. The slowest layer is grid interconnection (permitting, transformer lead times, substation construction). It takes 3-6 years to build a new high-voltage substation; 18-24 months for a data center shell if power is already available at the fence. - **Supply elasticity:** Global grid interconnect capacity for new large loads is extremely inelastic (<5% annual growth). Transformer lead times exceed 2 years. Chip manufacturing capacity is growing >40% annually via new fabs and advanced packaging. - **Pricing signal:** Microsoft, Google, Amazon are paying $50-100/MWh premiums for firm power contracts in constrained regions (Northern Virginia, Dublin, Singapore). This premium is not yet reflected in AI infrastructure cost forecasts. **Forecast:** - **Probability:** 70% that a major hyperscaler publicly declares power availability as the bottleneck (vs. chip procurement) by Q2 2026. - **80% interval:** Q4 2025 to Q4 2026. - **Kill-criterion:** If transformer lead times drop below 12 months and physical interconnection wait times shrink below 18 months for a new 500+ MW facility, I am wrong. Conversely, if a single GPU generation (e.g., Blackwell Ultra) sees >6 months of shortage that cannot be attributed to power constraints, I am wrong. - **Edge check:** This is not consensus. Current discourse focuses on chip bottlenecks and \"peak data\" concerns. Power is widely discussed as a *future* constraint, but few investors realize it is already binding for *new* builds. The market prices compute on existing infrastructure, not marginal project feasibility. **Data:** Not the binding constraint. The market fears a data wall; synthetic data, RLHF, and model distillation already mitigate scarcity. Data is plentiful relative to training compute; its value is declining as models become more efficient. Data as a moat is overrated. **Chippery:** The chip constraint is real but transient. By 2025, capacity overshoot is plausible given the current fab buildout. The real bottleneck after 2026 will be the cost and speed of delivering gigawatts."
