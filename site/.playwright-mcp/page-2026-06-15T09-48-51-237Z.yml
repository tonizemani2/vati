diversification will happen. Might be partially priced in. I'll call it pre-consensus because there's active debate. Now, for the decomposition: I need a measurable quantity whose threshold defines YES. The question: \"China's share of global gallium refining stays above 90% through end of 2027.\" So YES = share >90% at all times until end of 2027. That's a continuous condition, but a simpler approach: measure China's share of global gallium refining capacity or production at a point in time, say end of 2027, and if it's >90%, then likely it stayed above 90% throughout. But it might have dipped temporarily. Better to ask: \"Will China's share of global gallium refining be above 90% at year-end 2027?\" That's a point-in-time forecast, which captures if diversification has meaningfully reduced share by then. I'll set resolution date 2027-12-31. Quantity: China's share of global gallium refining capacity (or output). But what data source? I need a public series or report that estimates this. The U.S. Geological Survey (USGS) publishes annual mineral commodity summaries, including gallium production and maybe refining capacity. They often give China's primary production share. Another source could be industry reports (Fastmarkets, Asian Metal). But for a forecast, I can use \"China's share of global refined gallium production as reported by the USGS Mineral Commodity Summaries, measured as a percentage.\" That's a published figure. However, USGS gives primary gallium production, not necessarily refining. But primary production share is typically China's dominance. Refining might be similar. Alternatively, I could use \"capacity\" but that's harder to measure. I'll go with \"China's share of global primary gallium production\" because it's a well-tracked metric and strongly correlated with refining share. The question says \"refining,\" but primary production includes refining from bauxite. Actually, gallium is recovered during refining of alumina, so primary production 