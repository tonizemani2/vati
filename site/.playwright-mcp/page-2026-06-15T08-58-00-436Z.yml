        - generic [ref=e113]: Will US installed grid battery storage reach 80 GW by end of 2027?
        - generic [ref=e114]:
          - generic [ref=e115]: "I believe it will **not** reach 80 GW by that date, though it will come close (60–70 GW). **Causal chain:** - Frontier: Utility-scale solar + wind deployment, which requires 2–4 hours of storage to maintain grid reliability. - Binding constraint: **Transformer and high-voltage switchgear lead times** (now 12–24 months) and **lithium supply chain permitting** (especially in Chile and Australia). The upstream lithium carbonate and hydroxide capacity is growing quickly (~20%/yr), but the bottleneck is not raw material—it's the time to site, permit, and commission new cell factories and BESS facilities in the US. - Inelastic input: **US cell manufacturing capacity for LFP (the dominant grid chemistry)**. Current nameplate is ~30 GWh/yr; even with announced expansions, practical usable capacity by end-2027 is likely 70–80 GWh/yr. At ~2.5 MWh per installed GW (for 4-hour systems), that yields ~32 GW of nameplate **if** all US-made cells go to grid storage, which they won't (EV demand competes). - Demand: IRA subsidies (ITC standalone storage) are strong, but interconnection queues are clogged (median 3–5 years). FERC Order 2023 helps but won't fully clear by 2027. - Pricing: Battery pack prices fell 50% in 2023–24, but that has already been priced into project pipelines. The marginal new storage is cheaper than a gas peaker today, so demand is elastic—the constraint is physical deployment speed, not cost. - Capital: No shortage; yieldcos and infrastructure funds are oversubscribed. **Already priced?** Yes, 65–80 GW by 2027 is consensus among BloombergNEF and Wood Mackenzie. The call to disagree is both sides are plausible. I think the low end wins because of the physical cell-and-transformer bottleneck. **Confidence:** Moderate (60/40). If cell factories ramp faster or IRA domestic-content bonus tweaks the balance, could hit 80. If a recession cuts interconnection investment, could stay below 60."
